name: Benchmark

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths: ["**.go"]
  push:
    branches: [master]
    paths: ["**.go"]

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  benchmark:
    name: Regression check
    if: github.event_name == 'push' || ( github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'with-benchmark') )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod
          check-latest: true
          cache: true
          cache-dependency-path: ./go.sum

      - name: Install benchstat tool
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest && \
            go install github.com/yoanm/go-bench-regression/cmd/bench-reg@latest

      - name: Run benchmarks on current code
        run: make benchmark bench_o="-count=7" | tee current.txt

      - name: PR - Checkout base branch
        if: github.event_name == 'pull_request'
        run: git checkout ${{ github.base_ref }}

      - name: Push - Checkout previous commit
        if: github.event_name == 'push'
        run: git checkout HEAD~1

      - name: Run benchmarks on original code
        run: make benchmark bench_o="-count=7" | tee previous.txt

      - name: Compare benchmarks
        run: benchstat previous.txt current.txt | tee benchstat.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            current.txt
            previous.txt
            benchstat.txt

      - name: Build summary
        run: |
          echo "## Benchmark Comparison" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat ${{ runner.temp }}/benchstat.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Detect regressions
        env:
          PIPE_FILE: ${{ runner.temp }}/pipe
        run: |
          # /!\ Use fifo rather than pipe to continue execution (in order to close the markdow code block) even
          # in case of error with bench-reg (which is the case when there is regressions)
          PIPE_FILE="${{ runner.temp }}/pipe"
          mkfifo "$PIPE_FILE"
          tee -a "$GITHUB_STEP_SUMMARY < "$PIPE_FILE &""


          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Regressions" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat ${{ runner.temp }}/benchstat.txt | bench-reg 10 > "$PIPE_FILE"
          res=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          
          rm -f "$PIPE_FILE"
          exit $res
  
